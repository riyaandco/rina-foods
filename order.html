
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wholesale Order | Rina Foods</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ec;
      color: #2d2119;
    }

    header {
      background: #2d2119;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 40px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #71675f;
    }

    .order-container {
      max-width: 700px;
      margin: 20px auto 80px;
      padding: 0 20px;
    }

    .order-box {
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(45,33,25,.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ddd2c6;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      background: #2d2119;
      color: white;
      padding: 16px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4a3628;
    }

    .note {
      margin-top: 18px;
      color: #766c64;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 600px) {

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 40px;
      }

      .order-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html" class="logo">
      Rina Foods
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
    </nav>

  </header>


  <section class="hero">

    <h1>Wholesale Order</h1>

    <p>
      Send us your requirements and we'll get back to you.
    </p>

  </section>


  <div class="order-container">

    <div class="order-box">

      <form id="orderForm">

        <label>Shop / Business Name</label>

        <input
          type="text"
          id="shopName"
          placeholder="Enter your shop name"
          required
        >


        <label>Your Name</label>

        <input
          type="text"
          id="customerName"
          placeholder="Enter your name"
          required
        >


        <label>Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          required
        >


        <label>Product</label>

        <select id="product" required>

  <option value="">
    Select a product
  </option>

  <option value="Laddoo">Laddoo</option>
  <option value="Jalebi">Jalebi</option>
  <option value="Halwa">Halwa</option>
  <option value="Special Mixture">Special Mixture</option>
  <option value="Spicy Mixture">Spicy Mixture</option>
  <option value="Tea Time Snacks">Tea Time Snacks</option>

</select>
<script>
const urlParams = new URLSearchParams(window.location.search);
const selectedProduct = urlParams.get("product");

if (selectedProduct) {
    document.getElementById("product").value = selectedProduct;
}
</script>


        <label>Quantity / Requirements</label>

        <textarea
          placeholder="Example: 10 kg Laddoo, 5 kg Jalebi..."
          required
        ></textarea>


        <label>Additional Message</label>

        <textarea
          placeholder="Any other requirements?"
        ></textarea>


        <button type="submit">
          Send Wholesale Enquiry
        </button>

      </form>

      <div class="note">
        This form is currently a design only.
        We'll connect it to WhatsApp/order management next.
      </div>

    </div>

  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const product = params.get("product");

  if (product) {
    const productSelect = document.getElementById("product");

    productSelect.value = product;
  }


</script>

<script>
document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const shopName = document.getElementById("shopName").value;
    const customerName = document.getElementById("customerName").value;
    const phoneNumber = document.getElementById("phone").value;
    const product = document.getElementById("product").value;
    const requirements = document.querySelector("textarea").value;

    const whatsappNumber = "919605005807";

    const message =
        "Hello Rina Foods!\n\n" +
        "I would like to enquire about:\n\n" +
        "Shop / Business Name: " + shopName + "\n" +
        "Customer Name: " + customerName + "\n" +
        "Phone Number: " + phoneNumber + "\n" +
        "Product: " + product + "\n" +
        "Quantity / Requirements: " + requirements;

    window.open(
        "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message),
        "_blank"
    );
});
</script>

</body>
</html>
